<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Crônicas de Valdor</title>
<style>
:root{--bg:#14161d;--tx:#f1f1f6;--pn:#262a37cc;--bd:#3a4052;--ac:#ffb347;--vd:#e04a4a;--xp:#4aa3e0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:none;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.3 system-ui,sans-serif;overflow:hidden}
canvas{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);image-rendering:pixelated;background:#000}
#hud{position:fixed;left:8px;top:6px;right:8px;display:flex;gap:10px;align-items:flex-start;pointer-events:none;text-shadow:0 1px 2px #000}
.barra{width:120px;height:10px;background:#0008;border:1px solid #fff5;border-radius:3px;overflow:hidden;margin-top:3px}
.barra i{display:block;height:100%}
#hpb i{background:var(--vd)}#xpb i{background:var(--xp)}
#msg{position:fixed;left:50%;top:44px;transform:translateX(-50%);background:var(--pn);padding:6px 12px;border-radius:8px;opacity:0;transition:opacity .25s;max-width:70vw;text-align:center;pointer-events:none}
#msg.on{opacity:1}
.btn{position:fixed;border-radius:50%;background:#ffffff26;border:2px solid #ffffff66;color:var(--tx);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
#joy{left:max(14px,env(safe-area-inset-left));bottom:14px;width:128px;height:128px}
#joy i{width:54px;height:54px;border-radius:50%;background:#ffffff55;position:absolute}
#bA{right:max(18px,env(safe-area-inset-right));bottom:20px;width:84px;height:84px;font-size:15px}
#bP{right:118px;bottom:14px;width:56px;height:56px}
#bE{right:118px;bottom:78px;width:56px;height:56px;background:#ffb34755;display:none}
#bM{top:6px;right:8px;width:44px;height:44px;border-radius:10px}
#painel{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:5}
#painel.on{display:flex}
#caixa{background:#262a37;border:1px solid var(--bd);border-radius:12px;padding:14px;max-width:min(560px,92vw);max-height:90vh;overflow:auto;touch-action:pan-y}
#caixa h3{margin:0 0 8px}
#caixa button{display:block;width:100%;min-height:48px;margin:6px 0;font:inherit;background:#3a4052;color:var(--tx);border:1px solid #fff3;border-radius:8px;padding:8px}
#caixa button:disabled{opacity:.45}
#caixa pre{white-space:pre-wrap;font-size:12px;max-height:55vh;overflow:auto;touch-action:pan-y;user-select:text;-webkit-user-select:text}
#girar{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;z-index:9;text-align:center;font-size:18px}
@media (orientation:portrait){#girar{display:flex}}
</style>
</head>
<body>
<canvas id="tela"></canvas>
<div id="hud"><div><div id="nv">Nv 1</div><div class="barra" id="hpb"><i></i></div><div class="barra" id="xpb"><i></i></div></div><div id="info"></div></div>
<div id="msg"></div>
<div class="btn" id="joy"><i id="knob"></i></div>
<div class="btn" id="bA">Atacar</div>
<div class="btn" id="bP">Poção</div>
<div class="btn" id="bE">Falar</div>
<div class="btn" id="bM">☰</div>
<div id="painel"><div id="caixa"></div></div>
<div id="girar">Gire o celular para jogar<br>(tela deitada)</div>
<script type="module" src="src/jogo.js"></script>
</body>
</html>
