<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Crônicas de Valdor</title>
<style>
:root{--bg:#14161d;--tx:#f1f1f6;--pn:#262a37cc;--bd:#3a4052;--ac:#ffb347;--vd:#e04a4a;--xp:#4aa3e0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:none;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.3 system-ui,sans-serif;overflow:hidden}
#tela{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);image-rendering:pixelated;background:#000}
#hud{position:fixed;left:8px;top:6px;right:8px;display:flex;gap:10px;align-items:flex-start;pointer-events:none;text-shadow:0 1px 2px #000}
.barra{width:120px;height:10px;background:#0008;border:1px solid #fff5;border-radius:3px;overflow:hidden;margin-top:3px}
.barra i{display:block;height:100%}
#hpb i{background:var(--vd)}#xpb i{background:var(--xp)}
#msg{position:fixed;left:50%;top:44px;transform:translateX(-50%);background:var(--pn);padding:6px 12px;border-radius:8px;opacity:0;transition:opacity .25s;max-width:70vw;text-align:center;pointer-events:none}
#msg.on{opacity:1}
.btn{position:fixed;border-radius:50%;background:#ffffff26;border:2px solid #ffffff66;color:var(--tx);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
#joy{left:max(14px,env(safe-area-inset-left));bottom:14px;width:128px;height:128px}
#joy i{width:54px;height:54px;border-radius:50%;background:#ffffff55;position:absolute}
#bA{right:max(18px,env(safe-area-inset-right));bottom:20px;width:84px;height:84px;font-size:15px}
#bP{right:118px;bottom:14px;width:56px;height:56px}
#bE{right:194px;bottom:20px;width:60px;height:60px;background:#ffb34755;display:none}
#bH1{right:112px;bottom:82px;width:62px;height:62px;font-size:11px}
#bH2{right:22px;bottom:114px;width:62px;height:62px;font-size:11px}
#bH3{right:186px;bottom:92px;width:56px;height:56px;font-size:10px}
#bH4{right:100px;bottom:154px;width:56px;height:56px;font-size:10px}
.btn.off{opacity:.45}
#hpb.veneno i{background:#6bd04a}
#bM{top:6px;right:8px;width:44px;height:44px;border-radius:10px}
#bS{top:6px;right:132px;min-width:48px;height:44px;border-radius:10px;padding:0 10px}
#bI{top:6px;right:60px;width:66px;height:44px;border-radius:10px}
#caixa .itens{display:flex;flex-wrap:wrap;gap:4px;max-height:96px;overflow:auto;touch-action:pan-y}
#caixa .itens button{width:auto;min-height:40px;margin:0;padding:4px 8px;font-size:12px}
#caixa .itens button.sel{outline:2px solid #fff}
#caixa .itens.lista{max-height:62vh;align-content:flex-start}
#caixa .dir p{margin:4px 0}
#caixa tr[data-e]{cursor:pointer}
#caixa .pers{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
#caixa .esq{display:flex;gap:6px}#caixa .esq table.num{align-self:start}
#caixa .boneco{display:grid;grid-template-columns:40px 104px 40px;grid-template-rows:repeat(4,40px);grid-auto-flow:column;gap:2px 4px;align-items:center;justify-items:center}
#caixa .boneco canvas{grid-column:2;grid-row:1/4;width:104px;height:104px;image-rendering:pixelated;background:radial-gradient(#ffffff14,#0000 70%);border-radius:10px;cursor:pointer}
#caixa .s-capacete{grid-column:1;grid-row:1}#caixa .s-ombros{grid-column:1;grid-row:2}#caixa .s-bracos{grid-column:1;grid-row:3}#caixa .s-arma{grid-column:1;grid-row:4}#caixa .s-peitoral{grid-column:3;grid-row:1}#caixa .s-capa{grid-column:3;grid-row:2}#caixa .s-grevas{grid-column:3;grid-row:3}#caixa .s-botas{grid-column:3;grid-row:4}#caixa .s-escudo{grid-column:2;grid-row:4}#caixa .boneco canvas{grid-row:1/4}
#caixa .slot{position:relative;width:40px;height:40px;min-height:40px;margin:0;padding:0;border:2px solid #fff3;border-radius:8px;background:#0003;display:flex;align-items:center;justify-content:center}
#caixa .slot img.ic{width:32px;height:32px;margin:0;background:none}
#caixa .slot i{position:absolute;right:2px;bottom:0;font-size:10px;font-style:normal;font-weight:700;color:#fff;text-shadow:0 1px 2px #000}
#caixa .slot small{font-size:8px;color:#aab}
#caixa .slot.sel{outline:2px solid #fff;outline-offset:1px}#caixa .slot.prova{box-shadow:0 0 8px #fff8}
#caixa .slot.vazio{border-style:dashed;border-color:#fff1}
#caixa .mgrade{display:grid;grid-template-columns:repeat(5,40px);gap:3px;margin:2px 0}
#caixa .mgrade .slot{width:40px;height:40px;min-height:40px}#caixa .mgrade .slot img.ic{width:30px;height:30px}
#caixa table.num{width:150px;font-size:11px;margin:0}#caixa table.num td{padding:1px 4px}
#caixa .up{color:#7fd27f;font-weight:700}#caixa .down{color:#ff7a7a;font-weight:700}
#caixa .abas{display:flex;gap:4px;margin-bottom:4px}#caixa .abas button.aba{width:auto;flex:1;min-height:34px;margin:0;padding:3px 6px;font-size:12px}
#caixa .abas button.aba.on{background:#5a6385;border-color:#fff8}
#caixa .conteudo .det{margin:2px 0;font-size:12px}
#caixa .conteudo > button{display:inline-block;width:auto;min-width:120px;margin:4px 6px 0 0}
#caixa .conteudo .atr button{width:48px;min-height:34px;margin:1px 0}#caixa .conteudo .atr{font-size:12px;padding:0;line-height:1.15}
#caixa .conteudo > button{min-height:34px;padding:3px 8px;font-size:12px}
#caixa img.ic{width:24px;height:24px;image-rendering:pixelated;vertical-align:middle;margin-right:4px;background:#0003;border-radius:4px}
#caixa .itens button{display:inline-flex;align-items:center}#caixa tr.sel td{background:#ffffff1a}
#bS.tem{background:#ffb347cc;color:#222;border-color:#ffb347;animation:pulso 1.2s infinite}
@keyframes pulso{50%{transform:scale(1.08)}}
#caixa .grade{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}
#caixa .duas{display:grid;grid-template-columns:1.2fr 1fr;gap:12px;align-items:start}
#caixa .atr{display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid #fff2;padding:2px 0;font-size:13px}
#caixa .atr button{width:52px;min-height:44px;margin:2px 0;flex:none}
#caixa h3 small{font-weight:400;font-size:13px;color:#ccd}
@media (max-width:560px){#caixa .duas,#caixa .grade{grid-template-columns:1fr}}
#caixa table{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0}#caixa td{padding:3px 4px;border-bottom:1px solid #fff2}#caixa td:last-child{text-align:right}
#painel{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:5}
#painel.on{display:flex}
#caixa{position:relative;flex:none;transform-origin:center center;background:#262a37;border:1px solid var(--bd);border-radius:12px;padding:12px 14px;max-width:min(820px,96vw);max-height:90vh;overflow:auto;touch-action:pan-y}
#caixa h3{margin:0 0 6px;padding-right:90px}
#caixa button.fechar{position:absolute;top:8px;right:8px;width:auto;min-height:40px;padding:4px 14px;margin:0}
#caixa .dir button{min-height:44px;margin:6px 0 0;padding:6px}
#caixa button{display:block;width:100%;min-height:48px;margin:6px 0;font:inherit;background:#3a4052;color:var(--tx);border:1px solid #fff3;border-radius:8px;padding:8px}
#caixa button:disabled{opacity:.45}
#caixa pre{white-space:pre-wrap;font-size:12px;max-height:55vh;overflow:auto;touch-action:pan-y;user-select:text;-webkit-user-select:text}
#girar{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;z-index:9;text-align:center;font-size:18px}
@media (orientation:portrait){#girar{display:flex}}
</style>
</head>
<body>
<canvas id="tela"></canvas>
<div id="hud"><div><div id="nv">Nv 1</div><div class="barra" id="hpb"><i></i></div><div class="barra" id="xpb"><i></i></div></div><div id="info"></div></div>
<div id="msg"></div>
<div class="btn" id="joy"><i id="knob"></i></div>
<div class="btn" id="bA">Atacar</div>
<div class="btn" id="bP">Poção</div>
<div class="btn" id="bH1">Nv 3</div>
<div class="btn" id="bH2">Nv 6</div>
<div class="btn" id="bH3">Nv 12</div>
<div class="btn" id="bH4">Nv 20</div>
<div class="btn" id="bE">Falar</div>
<div class="btn" id="bS">Atrib.</div>
<div class="btn" id="bI">Mochila</div>
<div class="btn" id="bM">☰</div>
<div id="painel"><div id="caixa"></div></div>
<div id="girar">Gire o celular para jogar<br>(tela deitada)</div>
<script type="module" src="src/jogo.js"></script>
</body>
</html>
